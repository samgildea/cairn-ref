<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cairn webview preview</title>
<!--
	Browser preview of the real webview bundle. Serve the repo root and open
	/scripts/harness/preview.html?theme=dark|light&state=/.harness/state.json
	PR and CI data below are mocked; stack data comes from the harness state file.
-->
<style id="theme"></style>
<script>document.write(`<link rel="stylesheet" href="../../media/cairn.css?${Date.now()}">`);</script>
<style>html, body { margin: 0; padding: 0; height: 100%; } body { padding: 0 8px; }</style>
</head>
<body>
<div id="root"><div class="empty"><p class="loading"><span class="dot pending"></span>Loading stack…</p></div></div>
<script>
const THEMES = {
	dark: {
		'font-family': '-apple-system, BlinkMacSystemFont, sans-serif', 'font-size': '13px', 'editor-font-family': 'Menlo, Monaco, monospace',
		'foreground': '#cccccc', 'descriptionForeground': '#9d9d9d', 'errorForeground': '#f85149', 'focusBorder': '#0078d4', 'contrastBorder': 'transparent',
		'sideBar-background': '#181818', 'panel-background': '#181818', 'panel-border': '#2b2b2b', 'widget-border': '#313131', 'widget-shadow': 'rgba(0,0,0,.36)',
		'editorWidget-background': '#202020', 'textCodeBlock-background': '#2b2b2b',
		'button-background': '#0078d4', 'button-foreground': '#ffffff', 'button-hoverBackground': '#026ec1', 'button-border': '#ffffff12',
		'button-secondaryBackground': '#313131', 'button-secondaryForeground': '#cccccc', 'button-secondaryHoverBackground': '#3c3c3c',
		'badge-background': '#616161', 'badge-foreground': '#f8f8f8',
		'input-background': '#313131', 'input-foreground': '#cccccc', 'input-border': '#3c3c3c',
		'dropdown-background': '#313131', 'dropdown-foreground': '#cccccc', 'dropdown-border': '#3c3c3c',
		'menu-background': '#1f1f1f', 'menu-foreground': '#cccccc', 'menu-border': '#454545', 'menu-selectionBackground': '#0078d4', 'menu-selectionForeground': '#ffffff',
		'list-hoverBackground': '#2a2d2e', 'list-dropBackground': '#383b3d', 'toolbar-hoverBackground': '#5a5d5e50', 'toolbar-activeBackground': '#63666750',
		'progressBar-background': '#0078d4', 'textLink-foreground': '#4daafc', 'textLink-activeForeground': '#4daafc',
		'testing-iconPassed': '#73c991', 'testing-iconFailed': '#f14c4c', 'testing-iconQueued': '#cca700',
		'charts-green': '#89d185', 'charts-yellow': '#cca700', 'editorWarning-foreground': '#cca700',
		'gitDecoration-addedResourceForeground': '#81b88b', 'gitDecoration-deletedResourceForeground': '#c74e39', 'gitDecoration-modifiedResourceForeground': '#e2c08d',
	},
	light: {
		'font-family': '-apple-system, BlinkMacSystemFont, sans-serif', 'font-size': '13px', 'editor-font-family': 'Menlo, Monaco, monospace',
		'foreground': '#3b3b3b', 'descriptionForeground': '#3b3b3b', 'errorForeground': '#f85149', 'focusBorder': '#005fb8', 'contrastBorder': 'transparent',
		'sideBar-background': '#f8f8f8', 'panel-background': '#f8f8f8', 'panel-border': '#e5e5e5', 'widget-border': '#e5e5e5', 'widget-shadow': 'rgba(0,0,0,.16)',
		'editorWidget-background': '#f8f8f8', 'textCodeBlock-background': '#f0f0f0',
		'button-background': '#005fb8', 'button-foreground': '#ffffff', 'button-hoverBackground': '#0258a8', 'button-border': '#0000001a',
		'button-secondaryBackground': '#e5e5e5', 'button-secondaryForeground': '#3b3b3b', 'button-secondaryHoverBackground': '#cccccc',
		'badge-background': '#cccccc', 'badge-foreground': '#3b3b3b',
		'input-background': '#ffffff', 'input-foreground': '#3b3b3b', 'input-border': '#cecece',
		'dropdown-background': '#ffffff', 'dropdown-foreground': '#3b3b3b', 'dropdown-border': '#cecece',
		'menu-background': '#ffffff', 'menu-foreground': '#3b3b3b', 'menu-border': '#cecece', 'menu-selectionBackground': '#005fb8', 'menu-selectionForeground': '#ffffff',
		'list-hoverBackground': '#f2f2f2', 'list-dropBackground': '#d6ebff', 'toolbar-hoverBackground': '#b8b8b850', 'toolbar-activeBackground': '#a6a6a650',
		'progressBar-background': '#005fb8', 'textLink-foreground': '#005fb8', 'textLink-activeForeground': '#005fb8',
		'testing-iconPassed': '#388a34', 'testing-iconFailed': '#f14c4c', 'testing-iconQueued': '#bf8803',
		'charts-green': '#388a34', 'charts-yellow': '#bf8803', 'editorWarning-foreground': '#bf8803',
		'gitDecoration-addedResourceForeground': '#587c0c', 'gitDecoration-deletedResourceForeground': '#ad0707', 'gitDecoration-modifiedResourceForeground': '#895503',
	},
};
const params = new URLSearchParams(location.search);
const theme = params.get('theme') === 'light' ? 'light' : 'dark';
const vars = THEMES[theme];
document.getElementById('theme').textContent =
	`html { ${Object.entries(vars).map(([k, v]) => `--vscode-${k}: ${v};`).join(' ')} background: ${vars['panel-background']}; color: ${vars.foreground}; font-family: ${vars['font-family']}; font-size: ${vars['font-size']}; }`;
document.body.classList.add(theme === 'light' ? 'vscode-light' : 'vscode-dark');

const MOCK_PRS = {
	'feat/auth': { number: 11, state: 'OPEN', title: 'Add auth middleware and session TTL', reviewDecision: 'APPROVED', ci: 'passing', comments: 3 },
	'feat/api': { number: 12, state: 'OPEN', title: 'Add get-user endpoint', reviewDecision: 'REVIEW_REQUIRED', ci: 'pending', comments: 1 },
	'feat/ui': { number: 13, state: 'OPEN', title: 'Add profile page', reviewDecision: 'CHANGES_REQUESTED', ci: 'failing', comments: 0 },
};
function decorate(state) {
	if (state.status !== 'ready' || params.get('mock') === '0') {
		return state;
	}
	state.lastFetch = Date.now() - 4 * 60_000;
	for (const layer of state.stack.layers) {
		const pr = MOCK_PRS[layer.name];
		if (pr) {
			layer.pr = { ...pr, url: '#', detailed: true, baseRefName: layer.parent };
			if (!layer.draft.titleEdited) {
				layer.draft.title = pr.title;
			}
		}
	}
	const current = params.get('current');
	if (current) {
		state.stack.currentBranch = current;
		for (const layer of state.stack.layers) {
			layer.isCurrent = layer.name === current;
		}
	}
	return state;
}

const posted = [];
window.cairnPosted = posted;
let state;
const send = msg => window.postMessage(msg, '*');
window.acquireVsCodeApi = () => ({
	getState: () => undefined,
	setState: () => {},
	postMessage(msg) {
		posted.push(msg);
		if (msg.type === 'ready' && state) {
			send({ type: 'state', state });
		} else if (msg.type === 'setDraft' && state.status === 'ready') {
			const layer = state.stack.layers.find(l => l.name === msg.branch);
			if (msg.title != null) {
				layer.draft = { ...layer.draft, title: msg.title, titleEdited: true };
			}
			if (msg.body != null) {
				layer.draft = { ...layer.draft, body: msg.body, bodyEdited: true };
			}
			send({ type: 'state', state });
		} else if (msg.type === 'previewPlan') {
			const order = msg.order;
			const steps = order.map((b, i) => ({
				kind: 'rebase', branch: b,
				command: `git rebase --onto ${i ? order[i - 1] : 'c805c0c'} <recorded-base> ${b}`,
				detail: `replay ${b}'s own commits onto ${i ? order[i - 1] : 'main'}`,
			}));
			steps.push({ kind: 'metadata', command: 'write .git/gh-stack', detail: `store order ${order.join(' ← ')}` });
			send({ type: 'plan', order, plan: { steps, moved: order, added: [], removed: [], noop: false, blockers: [], warnings: [] } });
		}
	},
});

fetch(params.get('state') ?? '/.harness/state.json')
	.then(r => r.json())
	.then(s => {
		state = decorate(s);
		const script = document.createElement('script');
		script.src = `../../dist/webview.js?${Date.now()}`;
		document.body.appendChild(script);
	});
</script>
</body>
</html>
